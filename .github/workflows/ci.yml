name: cron-timezone-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cron-timezone-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run cron timezone gate
        run: python tools/cron_timezone_gate.py --now 2026-11-26T08:00:00+08:00 --next 3
